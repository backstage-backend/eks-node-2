apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-node-2
  namespace: default
  labels:
    app: eks-node-2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eks-node-2
  template:
    metadata:
      labels:
        app: eks-node-2
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: eks-node-2
          image: CONTAINER_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/v1/items
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10